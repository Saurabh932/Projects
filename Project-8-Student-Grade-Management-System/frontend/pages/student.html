<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Student | Grade Manager</title>

    <link rel="stylesheet" href="../assets/css/student.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <button class="btn back-btn" onclick="goBack()">← Back</button>
    <h2 class="logo">🎓 Manage Student</h2>
    <button onclick="logout()" class="btn logout-btn">Logout</button>
</header>

<main class="container">
    <div class="card student-info">
        <h2 id="studentName"></h2>
        <div class="info-grid">
            <div class="info-item">
                <span class="label">Average</span>
                <span id="avg" class="value"></span>
            </div>
            <div class="info-item">
                <span class="label">Grade</span>
                <span id="grade" class="value grade-pill"></span>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>Subjects & Performance</h3>
        <table class="subject-table">
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th>Max</th>
                    <th>Teacher</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="subjectBody"></tbody>
        </table>
    </div>

    <div class="ai-card">
        <h3>
            AI Performance Analysis 
            <span class="ai-badge">Powered by AI</span>
        </h3>
        <div id="aiSummary">Generating analysis...</div>
    </div>
</main>

<script src="../assets/js/student.js"></script>
</body>
</html>
